# NexaTV — Gradle version catalog (NFR-012: pinned, lean toolchain).
# Toolchain refreshed in ADR-0014 (from the ADR-0002 spike baseline). Kotlin is AGP 9's built-in
# Kotlin, pinned to [kotlin] below; Compose uses the Kotlin Compose compiler plugin (same version).
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
composeBom = "2026.11.01"
coreKtx = "1.19.1"
lifecycle = "2.11.1"
activityCompose = "1.13.0"
tvMaterial = "1.1.0"
# Local persistence (ADR-0008): Proto DataStore + Protobuf lite toolchain.
datastore = "1.3.0"
protobufPlugin = "0.10.1"
protobuf = "4.36.2"
detekt = "1.23.8"
# detekt 1.23.x embeds its own Kotlin compiler; its classpath is pinned to this version (app module).
detektKotlin = "2.0.21"
# Unit-test stack (JVM / CI — no device).
junit = "4.13.2"
coroutinesTest = "1.11.0"
mockk = "1.14.12"
# Real org.json on the JVM test classpath: android.jar ships only stubs, so the WeatherRepository
# parser (ADR-0010) can only be unit-tested against the actual implementation (production uses the
# on-device org.json). Kept test-only, so it never bloats the APK (NFR-002).
json = "20260814"
# Performance tooling (device-gated): Macrobenchmark + Baseline Profile. The macrobench runtime
# version was 1.3.4 in the ADR-0002 spike; refreshed in ADR-0014. The baselineprofile
# Gradle plugin is versioned in lock-step with the benchmark library (same androidx.benchmark group).
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.1"
androidxTestJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

# Proto DataStore (ADR-0008): typed store + Protobuf-lite runtime + protoc for codegen.
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }

# Unit-test libraries.
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
# Real org.json implementation for JVM unit tests only (see version note above).
json = { group = "org.json", name = "json", version.ref = "json" }

# Performance tooling — Macrobenchmark + Baseline Profile (device-gated; see :benchmark).
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# Declared (apply false) only to pin the KGP version AGP 9's built-in Kotlin uses.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
# Baseline Profile Gradle plugin (versioned with the benchmark library above).
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
