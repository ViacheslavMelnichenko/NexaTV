// NexaTV — persisted launcher state schema (ADR-0008, Proto DataStore).
// Licensed under the Apache License, Version 2.0.
//
// Additive-only contract: never renumber or reuse a field tag, and never change a
// field's type. New state is a NEW field with a safe default, so old files keep
// deserializing. Tags for not-yet-built state are `reserved` to pin them now.
syntax = "proto3";

option java_package = "com.nexatv.launcher.data.proto";
option java_multiple_files = true;

// Root message for the single launcher-state DataStore file.
message LauncherStateProto {
  // The user's favorite apps, in pin / reorder order (M4). Empty by default.
  repeated AppKeyProto favorites = 1;

  // User settings (ADR-0009). Unset on old files -> reads the default SettingsProto (MEDIUM tiles).
  SettingsProto settings = 4;

  // Reserved for upcoming / retired tags so they stay stable across schema growth. Tag 3 was
  // originally earmarked for a root-level theme id; the theme now lives in SettingsProto.theme
  // instead (ADR-0009), so tag 3 stays reserved forever (ADR-0008: never reuse a tag).
  //   2 = category assignments (M4), 3 = retired theme-id slot.
  reserved 2, 3;
}

// User-configurable launcher settings (ADR-0009). Grows additively: new settings are new fields
// with safe defaults, so old files keep deserializing. Tag 1 is the first setting (tile size).
message SettingsProto {
  // How large home tiles are drawn. TILE_SIZE_UNSPECIFIED (the default) means the owner never
  // chose, which the repository resolves to MEDIUM.
  TileSize tile_size = 1;

  // The chosen color theme (Theming EPIC). THEME_ID_UNSPECIFIED (the default) means the owner never
  // chose, which the repository resolves to Pastel Dark. Lives here (not root tag 3) per ADR-0009:
  // all settings belong in SettingsProto; root tag 3 stays reserved forever (ADR-0008, never reuse).
  ThemeId theme = 2;
}

// Color theme identity (Theming EPIC). Semantic ids, not raw colors — the UI maps each to a
// NexaColorScheme, so storage stays color-free. Grows additively; never renumber or reuse a value.
enum ThemeId {
  THEME_ID_UNSPECIFIED = 0;
  THEME_ID_PASTEL_DARK = 1;
  THEME_ID_OLED_BLACK = 2;
  THEME_ID_AMBER_EMBER = 3;
  THEME_ID_MAGENTA_NOIR = 4;
}

// Home tile size presets (ADR-0009). Semantic S/M/L, not raw dp — the UI maps each to dimensions,
// so storage stays layout-free and a future custom size can reuse the token.
enum TileSize {
  TILE_SIZE_UNSPECIFIED = 0;
  TILE_SIZE_SMALL = 1;
  TILE_SIZE_MEDIUM = 2;
  TILE_SIZE_LARGE = 3;
}

// Stable identity of a launchable activity within a user profile. Chosen so a
// pinned favorite survives app updates (component is stable across versions).
message AppKeyProto {
  // ComponentName.flattenToString() of the launchable activity.
  string component = 1;
  // Profile serial (UserManager.getSerialNumberForUser) — distinguishes work/clone profiles.
  int64 user_serial = 2;
}
