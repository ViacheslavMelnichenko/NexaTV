# NexaTV — detekt overrides (layered on buildUponDefaultConfig = true).
# Only deviations from detekt's defaults live here.

build:
  maxIssues: 0

naming:
  # Token files intentionally hold a namespaced object (e.g. Color.kt -> NexaColors).
  MatchingDeclarationName:
    active: false
  # @Composable functions are PascalCase by Compose convention.
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  # @Composable functions are declarative UI trees, not imperative logic: parameter counts
  # (state + event callbacks), tree length, and "many small composables per file" are idiomatic,
  # so detekt's imperative-code size thresholds don't apply to them.
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']

style:
  MaxLineLength:
    maxLineLength: 120
  # Design tokens are literal by nature (dp grid, sp sizes, color hex).
  MagicNumber:
    active: false
  # @Preview composables are entry points consumed by tooling, not dead code.
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
