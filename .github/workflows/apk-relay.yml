# Temporary APK relay (throwaway). The corp network on the maintainer's host blocks
# *.githubusercontent.com, so `gh release download` fails there. This workflow runs on a
# GitHub runner (which can reach the release CDN), downloads the signed APK, and force-pushes
# it onto a temp `apk-drop` branch. The host then fetches it over the git protocol
# (`git cat-file -p origin/apk-drop:<apk>`), verifies the SHA-256, and sideloads it.
# Delete this workflow + the apk-drop branch once the fetch is done.
name: APK relay
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to relay
        required: true
        default: v0.2.0
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release APK and push to apk-drop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --pattern '*.apk' --dir /tmp/drop
          git config user.email "relay@local"
          git config user.name "apk-relay"
          git checkout --orphan apk-drop
          git rm -rf --quiet . || true
          cp /tmp/drop/*.apk .
          git add ./*.apk
          git commit -q -m "relay ${{ inputs.tag }}"
          git push -f origin apk-drop
