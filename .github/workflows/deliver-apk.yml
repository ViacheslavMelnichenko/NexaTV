name: Deliver APK (temporary relay)

# One-off helper: the dev host's corporate network blocks *.githubusercontent.com,
# so it cannot pull release assets. A GitHub runner (which can reach the CDN)
# downloads the published APK and pushes it to a throwaway `apk-drop` branch that
# the dev host fetches over the git protocol (github.com), then deletes.
# Safe to remove after use.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to relay
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir drop
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.apk' \
            --dir drop
          ls -l drop

      - name: Push the APK to a throwaway branch
        run: |
          cd drop
          git init -q
          git checkout -q -b apk-drop
          git add -f *.apk
          git -c user.email=ci@nexatv.local -c user.name=nexatv-ci \
            commit -qm "relay: ${{ inputs.tag }} apk"
          git push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            apk-drop
